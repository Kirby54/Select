[project]
name = "select-workspace"
version = "0.1.0"
description = "Workspace root for Select (not published)."
requires-python = ">=3.12,<3.14"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/select-verify", "apps/api"]

[tool.uv.sources]
select-verify = { workspace = true }
select-api = { workspace = true }

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.3",
    "mypy==2.4.1",
    "types-PyYAML>=6.0.12",
    "pymap==0.36.7",
    "aiosmtpd==1.4.6",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "RUF"]
ignore = ["S101", "S311", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Query", "fastapi.Path", "fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
"apps/api/select_api/migrations/**" = ["E501", "I001", "UP"]
"**/tests/**" = ["S105", "S106"]

[tool.pytest.ini_options]
addopts = "-q"
