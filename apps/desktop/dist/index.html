<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Select</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #dcddde; font: 14px/1.5 system-ui, "Segoe UI", sans-serif; overflow: hidden; }
  #bar { height: 32px; display: flex; justify-content: space-between; align-items: stretch; border-bottom: 1px solid #161616; user-select: none; }
  #bar .title { display: flex; align-items: center; gap: 8px; padding-left: 12px; color: #8a8a8a; font-size: 12px; flex: 1; }
  #bar button { width: 46px; border: 0; background: none; color: #999; display: grid; place-items: center; cursor: pointer; }
  #bar button:hover { background: rgb(255 255 255 / 0.1); color: #fff; }
  #bar #close:hover { background: #c42b1c; }
  #bar svg { width: 10px; height: 10px; fill: none; stroke: currentColor; stroke-width: 1; }
  main { height: calc(100% - 33px); display: grid; place-items: center; text-align: center; }
  .mark { width: 44px; height: 44px; margin: 0 auto 14px; }
  h1 { font-size: 16px; font-weight: 600; margin: 0 0 4px; color: #fff; }
  p { margin: 0; color: #999; font-size: 13px; }
  code { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; color: #c4b5ff; }
  .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #4ade80; margin-right: 6px; animation: pulse 1s infinite alternate; }
  @keyframes pulse { from { opacity: .3 } to { opacity: 1 } }
  #help { margin-top: 18px; max-width: 420px; display: none; }
</style>
</head>
<body>
<div id="bar" data-tauri-drag-region>
  <div class="title" data-tauri-drag-region>
    <svg viewBox="0 0 24 24" style="width:15px;height:15px;stroke:none" aria-hidden="true"><path d="M12 2.5 1.5 20.5h9.2L12 2.5Z" fill="#a68bff"/><path d="M12 2.5 22.5 20.5h-11.8L12 2.5Z" fill="#facc15"/></svg>
    <span data-tauri-drag-region>Select</span>
  </div>
  <div style="display:flex">
    <button id="min" aria-label="Minimize" title="Minimize"><svg viewBox="0 0 10 10"><path d="M1 5h8"/></svg></button>
    <button id="max" aria-label="Maximize" title="Maximize"><svg viewBox="0 0 10 10"><rect x="1.5" y="1.5" width="7" height="7"/></svg></button>
    <button id="close" aria-label="Close" title="Close"><svg viewBox="0 0 10 10"><path d="M1.5 1.5l7 7M8.5 1.5l-7 7"/></svg></button>
  </div>
</div>
<main>
  <div>
    <svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5 1.5 20.5h9.2L12 2.5Z" fill="#a68bff"/><path d="M12 2.5 22.5 20.5h-11.8L12 2.5Z" fill="#facc15"/></svg>
    <h1>Select</h1>
    <p id="status"><span class="dot"></span>Waiting for Select on this computer…</p>
    <p id="help">Select is not running yet. Start it with <code>scripts\start-desktop.ps1</code> in the Select folder; this window opens it as soon as it answers.</p>
  </div>
</main>
<script>
  // Window buttons (the window has no Windows frame).
  const win = window.__TAURI__ && window.__TAURI__.window && window.__TAURI__.window.getCurrentWindow();
  if (win) {
    document.getElementById("min").onclick = () => win.minimize();
    document.getElementById("max").onclick = () => win.toggleMaximize();
    document.getElementById("close").onclick = () => win.close();
  }
  // Open Select as soon as its server answers on this machine.
  const URL = "http://localhost:3000";
  const started = Date.now();
  async function check() {
    try {
      await fetch(URL + "/api/health", { mode: "no-cors", cache: "no-store" });
      location.replace(URL + "/");
      return;
    } catch (error) {
      // Not reachable yet: keep waiting, and after a few seconds say how to start it.
      if (Date.now() - started > 6000) document.getElementById("help").style.display = "block";
    }
    setTimeout(check, 1000);
  }
  check();
</script>
</body>
</html>
