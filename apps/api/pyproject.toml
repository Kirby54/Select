[project]
name = "select-api"
version = "0.2.0"
description = "Select backend: API, worker, autonomy engine."
license = "AGPL-3.0-only"
requires-python = ">=3.12,<3.14"
dependencies = [
    "select-verify",
    "fastapi>=0.162,<0.163",
    "uvicorn>=0.54,<0.55",
    "sqlalchemy>=2.1.6,<2.2",
    "alembic>=1.20,<1.21",
    "psycopg[binary]>=3.3.7,<3.4",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "cryptography>=50.0.2,<51",
    "httpx>=0.28.1,<0.29",
    "anthropic>=2.4,<3",
    "openai>=3.42,<4",
    "pyyaml>=6.0.3,<7",
    "argon2-cffi>=25.1,<26",
    "croniter>=6.2,<7",
]

[project.scripts]
select-api = "select_api.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["select_api"]
