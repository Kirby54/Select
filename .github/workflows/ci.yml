name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: select_user
          POSTGRES_PASSWORD: select
          POSTGRES_DB: select_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U select_user -d select_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      SELECT_TEST_DATABASE_URL: postgresql+psycopg://select_user:select@127.0.0.1:5432/select_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      - run: uv sync --all-packages --frozen
      - run: uv run ruff check apps packages
      - run: uv run ruff format --check apps packages
      - run: uv run select-api check-contracts
      - run: uv run pytest packages/select-verify/tests apps/api/tests
      - run: python3 -m unittest discover -s bench -p 'test_*.py'
      - run: bash -n start.sh
      - run: python3 scripts/check-readme-links.py
      - run: python3 scripts/check-release-readiness.py --validate
      - run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

  windows-startup:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Validate Windows PowerShell installer syntax
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD/start.ps1", [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.ToString() }
            exit 1
          }
          Write-Host "PowerShell installer parses successfully (Docker runtime not tested on Windows)."

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev

  e2e:
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: select
          POSTGRES_PASSWORD: select
          POSTGRES_DB: select
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U select -d select"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      SELECT_DATABASE_URL: postgresql+psycopg://select:select@127.0.0.1:5432/select
      SELECT_DATA_DIR: ${{ github.workspace }}/.run/select-data
      SELECT_DEMO_STEP_DELAY_MS: "50"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: uv sync --all-packages --frozen
      - run: npm ci && npm run build && npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: ./scripts/dev-up.sh
      - run: npx playwright test
        working-directory: apps/web
      - if: failure()
        run: tail -n 200 .run/*.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/test-results

  e2e-complete:
    # The whole loop in password mode, against real IMAP and SMTP servers running on the runner.
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: select
          POSTGRES_PASSWORD: select
          POSTGRES_DB: select
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U select -d select"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      SELECT_DATABASE_URL: postgresql+psycopg://select:select@127.0.0.1:5432/select
      SELECT_DATA_DIR: ${{ github.workspace }}/.run/select-data
      SELECT_AUTH_MODE: password
      SELECT_PUBLIC_URL: http://localhost:3000
      SELECT_SCHEDULER_SECONDS: "5"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: uv sync --all-packages --frozen
      - run: npm ci && npm run build && npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Local mail servers
        run: |
          mkdir -p .run
          nohup uv run python scripts/dev-mail.py serve --out "$RUNNER_TEMP/sent-mail" > .run/mail.log 2>&1 &
      - run: ./scripts/dev-up.sh
      - run: npx playwright test complete
        working-directory: apps/web
        env:
          E2E_PASSWORD_BASE_URL: http://localhost:3000
          E2E_SENT_DIR: ${{ runner.temp }}/sent-mail
      - if: failure()
        run: tail -n 200 .run/*.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-complete
          path: apps/web/test-results

  docker:
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build
      - name: Start full Docker stack
        run: docker compose up -d
      - name: Verify running services and API health through the web proxy
        run: |
          # The worker is a long-lived process without an HTTP healthcheck:
          # compose --wait treats that as an error even while the process is running.
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /tmp/select-health.json; then
              break
            fi
            sleep 2
          done
          python3 -c 'import json; data=json.load(open("/tmp/select-health.json")); assert data["status"] == "ok"; assert data["contracts"]; print("Web-to-API smoke test passed")'
          docker compose ps --status running --services | grep -x worker
      - name: Verify database backup and recovery on a fresh test database
        run: |
          set -euo pipefail
          # Only CI's disposable database is touched; never overwrite the live database.
          docker compose exec -T db pg_dump -U select -Fc -d select > "$RUNNER_TEMP/select-ci-backup.dump"
          test -s "$RUNNER_TEMP/select-ci-backup.dump"
          docker compose exec -T db createdb -U select select_restore_ci
          docker compose exec -T db pg_restore -U select --no-owner --exit-on-error -d select_restore_ci < "$RUNNER_TEMP/select-ci-backup.dump"
          restored=$(docker compose exec -T db psql -U select -d select_restore_ci -Atqc "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public' AND table_name = 'companies'")
          test "$restored" = "1"
          echo "Disposable PostgreSQL backup/restore smoke test passed"
      - name: Show Docker logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail 150
      - name: Stop stack
        if: always()
        run: docker compose down --remove-orphans
