name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: select_user
          POSTGRES_PASSWORD: select
          POSTGRES_DB: select_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U select_user -d select_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      SELECT_TEST_DATABASE_URL: postgresql+psycopg://select_user:select@127.0.0.1:5432/select_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      - run: uv sync --all-packages --frozen
      - run: uv run ruff check apps packages
      - run: uv run ruff format --check apps packages
      - run: uv run select-api check-contracts
      - run: uv run pytest packages/select-verify/tests apps/api/tests

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev

  e2e:
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: select
          POSTGRES_PASSWORD: select
          POSTGRES_DB: select
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U select -d select"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      SELECT_DATABASE_URL: postgresql+psycopg://select:select@127.0.0.1:5432/select
      SELECT_DATA_DIR: ${{ runner.temp }}/select-data
      SELECT_DEMO_STEP_DELAY_MS: "50"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: uv sync --all-packages --frozen
      - run: npm ci && npm run build && npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: ./scripts/dev-up.sh
      - run: npx playwright test
        working-directory: apps/web
      - if: failure()
        run: tail -n 200 .run/*.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/test-results

  docker:
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build
