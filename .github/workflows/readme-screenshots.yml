name: Refresh real README screenshots

# Deliberately opt-in on merge of this workflow or manual dispatch. No fake UI images.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/readme-screenshots.yml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: real-readme-screenshots-chrome-v2
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: select
          POSTGRES_PASSWORD: select
          POSTGRES_DB: select
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U select -d select"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      SELECT_DATABASE_URL: postgresql+psycopg://select:select@127.0.0.1:5432/select
      SELECT_DATA_DIR: ${{ github.workspace }}/.run/readme-data
      SELECT_DEMO_STEP_DELAY_MS: "30"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: uv sync --all-packages --frozen
      - name: Build frontend
        run: npm ci && npm run build
        working-directory: apps/web
      - name: Select installed browser or install Playwright Chromium
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
            echo "Using preinstalled Chrome."
          elif command -v chromium >/dev/null 2>&1; then
            echo "CHROME_PATH=$(command -v chromium)" >> "$GITHUB_ENV"
            echo "Using preinstalled Chromium."
          else
            cd apps/web
            npx playwright install --with-deps chromium
          fi
      - name: Start Select and the local test mail servers
        run: |
          set -euo pipefail
          ./scripts/dev-up.sh
          mkdir -p .run
          nohup uv run python scripts/dev-mail.py serve --out .run/sent-mail > .run/dev-mail.log 2>&1 &
          for _ in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/1143) 2>/dev/null; then exit 0; fi
            sleep 1
          done
          echo "The local IMAP server did not start" >&2
          exit 1
      - name: Create the sample company through the public API (no model is called)
        run: uv run python scripts/sample-company.py --api http://127.0.0.1:8000
      - name: Capture genuine desktop and mobile UI
        run: node scripts/readme-screenshots.mjs http://127.0.0.1:3000 docs/screenshots
      - name: Update README gallery after validating PNG outputs
        run: python3 scripts/update-readme-screenshots.py
      - name: Upload screenshots for review
        uses: actions/upload-artifact@v4
        with:
          name: real-select-readme-screenshots
          path: docs/screenshots/*.png
          if-no-files-found: error
          retention-days: 30
      - name: Publish captures in a review branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="docs/real-readme-captures-${GITHUB_RUN_ID}"
          git switch -c "$BRANCH"
          git add README.md docs/screenshots/
          if git diff --cached --quiet; then
            echo "No screenshot changes were produced."
            exit 0
          fi
          git commit -m "docs: refresh README from real Select Playwright captures"
          git push origin "HEAD:refs/heads/$BRANCH"
          if ! gh pr create --base main --head "$BRANCH"             --title "docs: update README with real desktop and mobile screenshots"             --body "Generated by real Playwright screenshots of a running Select instance showing the sample company of scripts/sample-company.py (results submitted through the API, no model called). Review the image diffs before merging. No paid provider key was used."; then
            echo "::warning::The screenshots branch was pushed but the repository blocks Actions from creating PRs."
            echo "Open https://github.com/${GITHUB_REPOSITORY}/compare/main...$BRANCH to propose the update."
          fi
      - name: Print server logs on failure
        if: failure()
        run: tail -n 150 .run/*.log
