name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. docker compose up --build
        2. Open the demo and click "Run demo week"
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Select version or commit
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How do you run Select?
      options: [docker compose, scripts/dev-up.sh, other]
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output of `docker compose logs api worker` (remove any secret first).
      render: text
