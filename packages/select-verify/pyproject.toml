[project]
name = "select-verify"
version = "1.0.0"
description = "Delivery contracts and verifiable receipts for AI agent work."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14,<3",
    "pyyaml>=6.0.3,<7",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["select_verify"]
